<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Agent Monitor</title>
<style>
:root{
  /* Omarchy theme "Event Horizon" (~/.config/omarchy/themes/event-horizon/colors.toml); status tints = colour 16% over bg */
  --bg:#050505; --panel:#0e0e0e; --line:#1e1e1e; --line2:#2a2a2a; --text:#c8c8c8; --dim:#7a7a7a; --faint:#2a2a2a;
  --green:#8ea889; --green-bg:#1a1e19; --amber:#b4ad8c; --amber-bg:#1f1e1a; --blue:#8b9aac; --blue-bg:#1a1c1f;
  --violet:#8aa5a5; --violet-bg:#191e1e; --red:#b07c7c;
  --muted:#8a8a8a; --pink:#a48da8; --pink-bg:#1e1a1f; --red-bg:#211717; --focus:#f0f0f0;
  --r:7px; --gap:12px; --hit:32px;
}
*{box-sizing:border-box}
body{margin:0;overflow:clip;background:var(--bg);color:var(--text);font:13px/1.45 "JetBrainsMono Nerd Font","JetBrains Mono",ui-monospace,monospace}
body:before{content:"";position:fixed;inset:0;pointer-events:none;
  background-image:radial-gradient(var(--faint) 1px,transparent 1px);background-size:22px 22px;opacity:.25}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.app{height:100vh;overflow:clip;display:grid;position:relative;
  grid-template-columns:260px minmax(0,1fr);grid-template-rows:40px minmax(0,1fr);grid-template-areas:"hdr hdr" "side main"}
header{grid-area:hdr;display:flex;align-items:center;gap:16px;padding:0 20px;border-bottom:1px solid var(--line)}
h1{margin:0;font-size:13px;letter-spacing:.08em;color:var(--dim);font-weight:600}
h1 b{color:var(--text)}
.live{display:inline-flex;align-items:center;gap:6px;color:var(--green);font-size:11px}
.live i{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);animation:pulse 1.6s infinite}
.live.off{color:var(--red)} .live.off i{background:var(--red);box-shadow:0 0 8px var(--red)}
.live.wait{color:var(--amber)} .live.wait i{background:var(--amber);box-shadow:0 0 8px var(--amber)}
@keyframes pulse{50%{opacity:.3}}
.spacer{flex:1}
#clock{color:var(--muted);font-size:11px}
aside{grid-area:side;overflow:auto;border-right:1px solid var(--line);padding:14px;position:relative}
.lbl{font-size:10px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;margin:14px 0 10px}
.sess{display:block;width:100%;min-height:var(--hit);text-align:left;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:var(--r);
  padding:9px 10px;margin-bottom:8px;cursor:pointer;font:inherit}
.sess:hover{border-color:var(--line2)}
.sess[aria-current=true]{border-color:var(--blue);background:var(--blue-bg)}
.sess .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sess .m{font-size:11px;color:var(--muted);display:flex;gap:8px;margin-top:3px;align-items:center;flex-wrap:wrap}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;background:var(--faint);margin-right:6px;vertical-align:1px}
.dot.on{background:var(--green);box-shadow:0 0 6px var(--green)}
.pill{font-size:10px;padding:1px 7px;border-radius:999px;border:1px solid currentColor;flex:none}
.pill.pk{color:var(--pink)}
.muted{color:var(--muted)}
main{grid-area:main;min-width:0;overflow:clip;display:grid;grid-template-columns:minmax(0,1fr);position:relative;
  grid-template-rows:44px minmax(220px,1fr) auto auto auto;grid-template-areas:"bar" "graph" "chat" "perms" "prompt"}
.toolbar{grid-area:bar;display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid var(--line);min-width:0}
.toolbar .ttl{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40%}
.toolbar .cwd{color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.seg{display:inline-flex}
.seg button,.btn{min-height:var(--hit);min-width:var(--hit);background:var(--panel);color:var(--text);border:1px solid var(--line2);padding:0 12px;font:inherit;cursor:pointer}
.seg button:first-child{border-radius:var(--r) 0 0 var(--r)} .seg button:last-child{border-radius:0 var(--r) var(--r) 0;border-left:0}
.seg button[aria-pressed=true]{background:var(--blue-bg);border-color:var(--blue);color:var(--blue)}
.btn{border-radius:var(--r)} .btn:disabled{opacity:.5;cursor:not-allowed}
#stop{color:var(--red);border-color:var(--red)}
#mode{min-height:var(--hit);background:var(--panel);color:var(--text);border:1px solid var(--line2);border-radius:var(--r);font:inherit}
#graph{grid-area:graph;position:relative;min-height:0;overflow:hidden}
#cy{position:absolute;inset:0}
#nodelist{position:absolute;inset:0;overflow:auto;padding:14px 18px}
#nodelist ol{list-style:none;margin:0;padding:0}
#nodelist h3{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:14px 0 8px;font-weight:400}
#nodelist button{display:block;width:100%;min-height:var(--hit);text-align:left;background:var(--panel);color:var(--text);border:1px solid var(--line2);
  border-radius:var(--r);padding:6px 10px;margin-bottom:6px;font:inherit;cursor:pointer}
#nodelist button .sub{display:block;color:var(--muted);font-size:11px}
#nodelist button.running{border-color:var(--amber);background:var(--amber-bg)}
#nodelist button.running.review{border-color:var(--violet);background:var(--violet-bg)}
#nodelist button.waiting{border-color:var(--pink);background:var(--pink-bg);border-style:double;border-width:3px}
#nodelist button.done{border-color:var(--green);background:var(--green-bg)}
#nodelist button.error{border-color:var(--red);background:var(--red-bg);border-style:dashed}
.hint{position:absolute;left:0;right:0;top:50%;transform:translateY(60px);text-align:center;color:var(--muted);pointer-events:none}
.empty{color:var(--muted);padding:60px 20px;text-align:center}
.empty.err{color:var(--red)}
#perms{display:none;grid-area:perms;max-height:none;overflow:auto;padding:0 14px}
#perms.on{display:block;padding:8px 14px}
.perm{border:1px solid var(--pink);background:var(--pink-bg);border-radius:var(--r);padding:10px 12px;margin-bottom:8px}
.perm h3{margin:0;font-size:12px;color:var(--pink);font-weight:600}
.perm .who{background:none;border:0;padding:0;color:var(--muted);font:inherit;text-decoration:underline;cursor:pointer;min-height:24px}
.perm .desc{color:var(--muted);font-size:11px;overflow-wrap:anywhere}
.perm pre{margin:6px 0;padding:8px 10px;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);white-space:pre-wrap;overflow-wrap:anywhere;font:inherit;font-size:12px;overflow:auto}
.perm pre code{font:inherit}
.perm .more{width:100%;margin-bottom:2px}
.perm .acts{display:flex;gap:8px;margin-top:8px}
.perm .acts .btn{flex:1}
.perm .allow{background:var(--green-bg);color:var(--green);border-color:var(--green);font-weight:600}
.perm .deny{background:var(--red-bg);color:var(--red);border-color:var(--red);font-weight:600}
.perm .allow:disabled{opacity:.55;cursor:not-allowed}
.perm .perm-err{color:var(--red);font-size:12px;margin:4px 0 0}
#chat{grid-area:chat;display:none;overflow:auto;padding:10px 16px;border-top:1px solid var(--line);position:relative}
main.chat-on{grid-template-rows:44px minmax(140px,1fr) minmax(80px,34vh) auto auto}
main.chat-on:has(#perms.on){grid-template-rows:44px minmax(120px,1fr) minmax(60px,18vh) auto auto}
main.chat-on #chat{display:block}
.msg{padding:3px 0;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.user{color:var(--blue)} .msg.user:before{content:"> "}
.msg.system,.msg.result,.chat-empty{color:var(--muted);font-size:11px}
.msg.err{color:var(--red)}
details.msg summary{cursor:pointer;color:var(--blue);min-height:22px;white-space:normal}
details.msg.err summary{color:var(--red)}
details.msg pre{margin:4px 0 6px;padding:8px 10px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);white-space:pre-wrap;overflow-wrap:anywhere;font:inherit;font-size:12px;max-height:260px;overflow:auto}
#promptbar{grid-area:prompt;display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;padding:10px 14px;border-top:1px solid var(--line)}
#prompt{flex:1;min-width:0;min-height:var(--hit);max-height:160px;resize:none;background:var(--panel);color:var(--text);border:1px solid var(--line2);border-radius:var(--r);padding:6px 10px;font:inherit}
#prompt:disabled{opacity:.55}
#send{background:var(--blue);color:var(--bg);border-color:var(--blue);font-weight:600}
#send:disabled{background:var(--panel);color:var(--muted);border-color:var(--line2)}
#perr{flex-basis:100%;color:var(--red);font-size:12px}
#new-session{width:100%;margin-bottom:6px}
#newform[hidden]{display:none}
#newform{display:grid;gap:8px;padding:10px;margin-bottom:8px;border:1px solid var(--line2);border-radius:var(--r);background:var(--panel)}
#newform label{display:grid;gap:3px;font-size:11px;color:var(--muted)}
#newform input,#newform select{min-height:var(--hit);background:var(--bg);color:var(--text);border:1px solid var(--line2);border-radius:var(--r);padding:0 8px;font:inherit}
#newform input[aria-invalid=true]{border-color:var(--red)}
.pill.bl{color:var(--blue)}
.item{display:flex;flex-direction:column;gap:4px;margin-bottom:8px} .item .sess{margin-bottom:0;flex:1;min-width:0}
.item .btn{align-self:flex-end;font-size:11px;padding:0 8px;white-space:normal;line-height:1.2}
#log{grid-row:2/4;grid-column:1;justify-self:end;width:min(440px,48%);z-index:5;background:var(--panel);border-left:1px solid var(--line2);overflow:auto;
  transform:translateX(100%);visibility:hidden;transition:transform .18s ease-out,visibility 0s .18s}
#log.open{transform:none;visibility:visible;transition:transform .18s ease-out}
#log header{grid-area:auto;position:sticky;top:0;background:var(--panel);height:auto;padding:12px 14px;gap:10px}
#log h2{margin:0;font-size:13px;flex:1;min-width:0;overflow-wrap:anywhere}
#log .meta{padding:8px 14px;color:var(--muted);font-size:11px;border-bottom:1px solid var(--line)}
#log .body{padding:10px 14px}
.ent{padding:6px 0;border-bottom:1px solid var(--line)}
.ent .r{font-size:11px;color:var(--muted)} .ent .r .tl{color:var(--blue)}
.ent .x{white-space:pre-wrap;overflow-wrap:anywhere}
.ent.user .x{color:var(--blue)}
@media (max-width:1150px){.app{grid-template-columns:220px minmax(0,1fr)} #log{width:min(380px,62%)}}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
<header>
  <h1>// <b>agent monitor</b> · claude-dev-team</h1>
  <span id="live" class="live" role="status"><i></i><span>connecting…</span></span>
  <span class="spacer"></span><a href="/brain" class="btn" style="display:inline-flex;align-items:center;text-decoration:none">◉ Brain</a><span id="clock"></span>
</header>
<aside>
  <button id="new-session" class="btn" data-testid="new-session" aria-expanded="false" aria-controls="newform">+ New session</button>
  <form id="newform" hidden aria-label="New session">
    <label>Working directory<input id="ncwd" name="cwd" data-testid="cwd" required spellcheck="false" autocomplete="off"></label>
    <label>Mode<select id="nmode" data-testid="mode" aria-label="Mode for new session">
      <option value="default">Default — ask when needed</option>
      <option value="acceptEdits">Accept edits</option>
      <option value="plan">Plan mode</option>
      <option value="auto">Auto — runs on its own</option>
    </select></label>
    <span class="muted" style="font-size:11px">The first prompt below starts the session.</span>
    <button type="button" id="ncancel" class="btn">Cancel</button>
  </form>
  <nav aria-label="Sessions" id="list"></nav>
</aside>
<main id="main">
  <div class="toolbar">
    <span class="ttl" id="ttl"></span><span class="cwd" id="cwd"></span><span class="spacer"></span>
    <div class="seg" id="scope" role="group" aria-label="Show in graph">
      <button id="s-now" aria-pressed="true" title="Finished waves collapsed — the ones working now show right away">Now</button><button id="s-all" aria-pressed="false" title="The whole job, all waves expanded">All</button>
    </div>
    <div class="seg" role="group" aria-label="View">
      <button id="v-graph" aria-pressed="true">Graph</button><button id="v-list" aria-pressed="false">List</button>
    </div>
    <select id="mode" data-testid="mode-runtime" aria-label="Permission mode" hidden>
      <option value="default">Default — ask when needed</option>
      <option value="acceptEdits">Accept edits</option>
      <option value="plan">Plan mode</option>
      <option value="auto">Auto — runs on its own</option>
    </select>
    <button id="stop" class="btn" data-testid="stop" aria-label="Interrupt the run" hidden>Stop</button>
  </div>
  <div id="graph">
    <div id="cy" role="img" aria-label="Agent graph" tabindex="-1"></div>
    <div id="nodelist" hidden></div>
    <div class="hint" id="hint" hidden>No subagents yet</div>
    <div class="empty" id="msg">waiting for data…</div>
  </div>
  <!-- M2 placeholders (inert, hidden in M1) -->
  <div id="chat" role="log" aria-live="off"></div>
  <div id="perms" role="region" aria-label="Pending permissions"></div>
  <div id="promptbar"><label class="sr-only" for="prompt">Prompt</label><textarea id="prompt" data-testid="prompt" rows="1" disabled placeholder="Select or create a session"></textarea><button id="send" class="btn" data-testid="send" disabled>Send</button><div id="perr" role="alert"></div></div>
  <div id="log" role="complementary" aria-labelledby="log-h" style="padding:0;border-right:0">
    <header><h2 id="log-h" tabindex="-1"></h2><span class="pill" id="log-st"></span>
      <button class="btn" id="log-x" aria-label="Close log">✕</button></header>
    <div class="meta" id="log-meta"></div><div class="body" id="log-body"></div>
  </div>
</main>
</div>
<div id="sr-chat" class="sr-only" aria-live="polite"></div>
<div id="sr-perm" class="sr-only" aria-live="assertive" aria-atomic="true"></div>
<script src="/vendor/cytoscape.min.js"></script>
<script src="/app.js" defer></script>
</body>
</html>
